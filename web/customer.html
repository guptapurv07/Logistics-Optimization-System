<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckSetu | Customer</title>
    <script>try { if (localStorage.getItem('trucksetu-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        .quantity-row { display: flex; gap: 10px; align-items: center; }
        .quantity-row input { flex: 1; min-width: 0; }
        .unit { font-weight: 600; min-width: 64px; }
        .preview { font-weight: 600; color: var(--blue); }
        .quote-error { display: block; color: var(--danger); font-weight: 500; }
        .goods-note { background: var(--box); border-radius: var(--radius); padding: 10px 12px; }
        /* Wide screens: booking form on the left, orders on the right; narrower screens stack them */
        .customer-layout { display: grid; gap: 18px; align-items: start; }
        .customer-layout > .panel + .panel { margin-top: 0; }
        .order-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        @media (min-width: 1600px) { .customer-layout { grid-template-columns: minmax(460px, 600px) minmax(0, 1fr); } }
        @media (max-width: 640px) { .order-grid { grid-template-columns: minmax(0, 1fr); } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/customer.html"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-bridge"/></svg></span><span class="brand-name">TruckSetu</span></a>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-small" id="refresh"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>Refresh</button>
                <button class="btn btn-secondary btn-small" data-theme-toggle></button>
                <button class="btn btn-secondary btn-small" id="logout"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>Log out</button>
            </div>
        </div>
    </header>

    <main class="page-wrap">
        <div class="page-head"><div><h1 id="company">Your shipments</h1><p id="contact"></p></div></div>

        <div class="customer-layout">
            <section class="panel">
                <div class="panel-head"><div><h2>Book a shipment</h2><p>Order in your goods' own unit; we work out the weight, the space and the price.</p><p class="hint" id="o-pricing" style="margin-top: 4px;"></p></div></div>
                <form id="order-form">
                    <div class="form-grid order-grid">
                        <div class="field"><label for="o-warehouse">Ship from warehouse</label><select id="o-warehouse" required></select></div>
                        <div class="field"><label for="o-destination">Deliver to city</label><select id="o-destination" required></select></div>
                        <div class="field"><label for="o-goods">Goods</label><select id="o-goods" required></select></div>
                        <div class="field">
                            <label for="o-quantity">Quantity</label>
                            <div class="quantity-row"><input id="o-quantity" type="number" min="0" step="1" required><span class="unit" id="o-unit"></span></div>
                            <span class="hint" id="o-preview"></span>
                        </div>
                        <div class="field wide"><span class="hint goods-note" id="o-handling"></span></div>
                        <div class="field"><label for="o-receiver">Receiver name</label><input id="o-receiver" required maxlength="80"></div>
                        <div class="field"><label for="o-phone">Receiver phone <span class="muted">(optional)</span></label><input id="o-phone" type="tel" maxlength="20"></div>
                        <div class="field wide"><label for="o-address">Delivery address</label><input id="o-address" required maxlength="200" placeholder="Building, street, area"></div>
                        <div class="field wide"><label for="o-notes">Notes for the driver <span class="muted">(optional)</span></label><input id="o-notes" maxlength="300"></div>
                    </div>
                    <div class="form-actions"><button class="btn btn-primary" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>Place order</button></div>
                    <div id="order-result"></div>
                </form>
            </section>

            <section class="panel">
                <div class="panel-head"><h2 id="orders-title">Your orders</h2></div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Order</th><th>Goods</th><th>From</th><th>To</th><th>Price</th><th>Status</th><th>Truck · driver</th><th>Placed</th><th>Delivered</th><th></th></tr></thead>
                        <tbody id="orders-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const E = App.escape;
        let catalog = null, data = null;

        const selectedGoods = () => catalog.goods.find(g => g.code === $('o-goods').value);
        const selectedWarehouse = () => catalog.warehouses.find(w => String(w.id) === $('o-warehouse').value);

        // The goods type decides the unit (bags, bales, tonnes, cartons) and how kg and m³ follow from the quantity
        function updateGoods() {
            const goods = selectedGoods();
            if (!goods) return;
            $('o-unit').textContent = goods.unit + 's';
            $('o-quantity').step = goods.unit === 'tonne' ? '0.1' : '1';
            $('o-handling').textContent = `${goods.kg_per_unit} kg and ${goods.m3_per_unit} m³ per ${goods.unit} · travels in ${goods.body_types.join(' or ')} trucks · ${goods.handling}`;
            updatePreview();
        }

        // The weight and space show at once; the road km and the price come from the server, which checks the order the
        // same way as when it is placed (so a too-big order says so before it is sent)
        let quoteTimer = null, quoteNumber = 0;
        function updatePreview() {
            const goods = selectedGoods(), amount = Number($('o-quantity').value);
            clearTimeout(quoteTimer);
            const number = ++quoteNumber;
            if (!goods || !(amount > 0)) {
                $('o-preview').innerHTML = '';
                return;
            }
            const local = `= ${App.formatNumber(amount * goods.kg_per_unit)} kg · ${App.formatNumber(amount * goods.m3_per_unit, 1)} m³`;
            $('o-preview').innerHTML = `<span class="preview">${local}</span>`;
            if (!$('o-warehouse').value || !$('o-destination').value) return;
            quoteTimer = setTimeout(async () => {
                try {
                    const quote = await App.api('/api/customer/quote', { warehouse_id: $('o-warehouse').value, goods_code: goods.code,
                                                                         quantity: $('o-quantity').value, destination_city: $('o-destination').value });
                    if (number !== quoteNumber) return;   // the form changed while the answer was on its way
                    $('o-preview').innerHTML = `<span class="preview">${local} · ${App.formatNumber(quote.distance_km)} km by road · ${App.formatMoney(quote.price)}</span>`;
                } catch (error) {
                    if (number !== quoteNumber) return;
                    $('o-preview').innerHTML = `<span class="preview">${local}</span><span class="quote-error">${E(error.message)}</span>`;
                }
            }, 250);
        }

        // The destination can't be the warehouse's own city
        function updateDestinations() {
            const warehouse = selectedWarehouse(), current = $('o-destination').value;
            const cities = catalog.cities.filter(c => !warehouse || c !== warehouse.city);
            App.fillSelect($('o-destination'), cities, c => c, c => c, 'Choose a city');
            if (cities.includes(current)) $('o-destination').value = current;
            updatePreview();
        }

        async function load() {
            data = await App.api('/api/customer/dashboard');
            const company = data.company || {};
            $('company').textContent = company.name || 'Your shipments';
            $('contact').textContent = `${data.user.full_name} · ${company.city || ''}`;
            document.title = `${company.name || 'Customer'} | TruckSetu`;
            renderOrders();
        }

        function renderOrders() {
            const orders = data.orders;
            $('orders-title').textContent = orders.length ? `Your orders (${orders.length})` : 'Your orders';
            $('orders-body').innerHTML = orders.length ? orders.map(o => `
                <tr>
                    <td><strong>#${o.id}</strong></td>
                    <td>${E(App.quantity(o.quantity, o.goods.unit))}<span class="sub">${E(o.goods.name)} · ${App.formatNumber(o.weight_kg)} kg</span></td>
                    <td><span class="nowrap">${E(o.warehouse.code)}</span><span class="sub">${E(o.warehouse.city)}</span></td>
                    <td>${E(o.destination_city)}<span class="sub">${E(o.receiver_name)}</span></td>
                    <td class="num">${o.price === null ? '—' : App.formatMoney(o.price)}${o.distance_km ? `<span class="sub">${App.formatNumber(o.distance_km)} km</span>` : ''}</td>
                    <td>${App.badge(o.status)}</td>
                    <td class="small">${o.trip ? `<span class="nowrap">${E(o.trip.truck_plate)}</span><span class="sub">${E(o.trip.driver_name)}</span>` : '—'}</td>
                    <td class="small">${App.formatDate(o.created_at)}</td>
                    <td class="small">${App.formatDate(o.delivered_at)}</td>
                    <td class="actions-cell">${o.status === 'pending' ? `<button class="btn btn-secondary btn-small btn-danger" data-cancel="${o.id}">Cancel</button>` : ''}</td>
                </tr>`).join('') : '<tr><td colspan="10" class="empty">No orders yet. Book your first shipment above.</td></tr>';
        }

        $('orders-body').addEventListener('click', event => {
            const button = event.target.closest('[data-cancel]');
            if (!button) return;
            const id = Number(button.dataset.cancel);
            App.busy(button, async () => {
                if (!await App.confirm({ title: `Cancel order #${id}?`, message: `The warehouse won't send a truck for it. This can't be undone.`,
                                         action: 'Cancel order', cancel: 'Keep order', danger: true })) return;
                await App.api('/api/customer/orders/cancel', { order_id: id });
                App.notify(`Order #${id} cancelled`);
                await load();
            });
        });

        $('order-form').addEventListener('submit', event => {
            event.preventDefault();
            const button = event.target.querySelector('button[type=submit]');
            App.busy(button, async () => {
                const result = await App.api('/api/customer/orders', {
                    warehouse_id: $('o-warehouse').value, goods_code: $('o-goods').value, quantity: $('o-quantity').value,
                    destination_city: $('o-destination').value, delivery_address: $('o-address').value,
                    receiver_name: $('o-receiver').value, receiver_phone: $('o-phone').value, notes: $('o-notes').value,
                });
                $('order-result').innerHTML = `<p class="notice">Order <strong>#${result.id}</strong> placed:
                    ${App.formatNumber(result.weight_kg)} kg, ${App.formatNumber(result.volume_m3, 1)} m³, <strong>${App.formatMoney(result.price)}</strong> before GST.
                    Route ${result.path.map(E).join(' → ')} (${App.formatNumber(result.distance_km)} km). It waits for the warehouse to dispatch a truck.</p>`;
                ['o-quantity', 'o-receiver', 'o-phone', 'o-address', 'o-notes'].forEach(id => { $(id).value = ''; });
                updatePreview();
                await load();
            });
        });

        $('o-goods').addEventListener('change', updateGoods);
        $('o-quantity').addEventListener('input', updatePreview);
        $('o-warehouse').addEventListener('change', updateDestinations);
        $('o-destination').addEventListener('change', updatePreview);
        $('logout').addEventListener('click', App.logout);
        $('refresh').addEventListener('click', event => App.busy(event.currentTarget, load));

        (async () => {
            try {
                catalog = await App.api('/api/catalog');
                App.fillSelect($('o-warehouse'), catalog.warehouses, w => w.id, w => `${w.code} · ${w.name} (${w.city})`);
                App.fillSelect($('o-goods'), catalog.goods, g => g.code, g => g.name);
                const pricing = catalog.pricing;
                $('o-pricing').textContent = `Price: ${App.formatMoney(pricing.rate_per_tonne_km)} per tonne-km by road from the warehouse · bulky goods by their space ` +
                    `(1 m³ counts as ${App.formatNumber(pricing.chargeable_kg_per_m3)} kg) · at least ${App.formatMoney(pricing.minimum_order_price)} per order · GST extra`;
                await load();
                // Start with the warehouse in the customer's own city, if there is one
                const local = catalog.warehouses.find(w => data.company && w.city === data.company.city);
                if (local) $('o-warehouse').value = String(local.id);
                updateDestinations();
                updateGoods();
            } catch (error) {
                App.notify(error.message, 'error');
            }
        })();
        setInterval(() => { if (!document.hidden && data) load().catch(() => {}); }, 30000);
    </script>
</body>
</html>
