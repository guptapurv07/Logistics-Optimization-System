<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckSetu | Every truck, the shortest road</title>
    <meta name="description" content="Book shipments, dispatch trucks and track every delivery across India, all in one place.">
    <script>try { if (localStorage.getItem('trucksetu-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        /* The highway scene fills the whole window: day with sun and clouds, night with a half moon, stars and headlights */
        body.landing { min-height: 100vh; min-height: 100dvh; overflow-x: hidden; background: linear-gradient(180deg, var(--art-sky-top), var(--art-sky-bottom) 70%); }
        .scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .scene-art { display: block; width: 100%; height: 100%; }
        .art-night { display: none; }
        :root[data-theme="dark"] .art-day { display: none; }
        :root[data-theme="dark"] .art-night { display: inline; }

        /* The road and the scenery slide left, so the truck drives forward (to the right) */
        .road-lines { animation: road 0.9s linear infinite; }
        @keyframes road { to { stroke-dashoffset: 44; } }
        .layer.far { animation: slide 120s linear infinite; }
        .layer.near { animation: slide 40s linear infinite; }
        .layer.posts { animation: posts 1.53s linear infinite; }
        @keyframes slide { to { transform: translateX(-600px); } }
        @keyframes posts { to { transform: translateX(-75px); } }
        .cloud { animation: cloud 240s linear infinite; }   /* the clouds keep to the sky above the words */
        .cloud.c2 { animation-delay: -60s; }
        .cloud.c3 { animation-delay: -120s; }
        .cloud.c4 { animation-delay: -180s; }
        @keyframes cloud { from { transform: translateX(1750px); } to { transform: translateX(-240px); } }
        .hub { transform-box: fill-box; transform-origin: center; animation: spin 2.3s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .twinkle { animation: twinkle 4s ease-in-out infinite; }
        .twinkle.t1 { animation-delay: -1.3s; }
        .twinkle.t0 { animation-delay: -2.6s; }
        @keyframes twinkle { 50% { opacity: 0.25; } }

        /* Top bar: the logo, then light/dark, Log in and Sign up in the top right corner */
        .landing-top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 40px; }
        .landing-top .brand-name { display: inline; }   /* the app pages hide it on narrow screens; here it stays */
        .landing-nav { display: flex; align-items: center; gap: 8px; }
        /* See-through buttons with the sky blurred behind them */
        .btn-glass { background: color-mix(in srgb, var(--surface) 55%, transparent); color: var(--text);
            border-color: color-mix(in srgb, var(--text) 14%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
        .btn-glass:hover { background: color-mix(in srgb, var(--surface) 85%, transparent); }

        .hero { position: relative; z-index: 1; padding: clamp(28px, 10vh, 120px) 40px 40px; max-width: 820px; }
        .eyebrow { display: inline-block; padding: 6px 12px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; color: var(--blue);
            background: color-mix(in srgb, var(--surface) 60%, transparent); border: 1px solid color-mix(in srgb, var(--blue) 28%, transparent);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
        .hero h1 { margin-top: 18px; font-size: clamp(2.5rem, 5.6vw, 4.6rem); font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; max-width: 11ch; }
        .hero .lead { margin-top: 18px; font-size: clamp(1.02rem, 1.5vw, 1.22rem); color: var(--muted); max-width: 38ch; }
        .hero-actions { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
        .btn-large { padding: 12px 22px; font-size: 1rem; }
        .hero-facts { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--muted); font-size: 0.9rem; }
        .hero-facts strong { color: var(--text); font-weight: 600; }

        @media (max-width: 640px) {
            .landing-top { padding: 14px 16px; }
            .landing-nav { gap: 6px; }
            .landing-nav .btn { padding: 7px 10px; }
            .landing-nav [data-theme-toggle] .label { display: none; }   /* just the sun or moon */
            .hero { padding: 28px 16px 24px; }
        }
        /* Short windows (a phone held sideways): smaller text, so it doesn't run into the road */
        @media (max-height: 560px) {
            .hero { padding-top: 12px; }
            .hero h1 { font-size: 2.2rem; margin-top: 12px; }
            .hero .lead, .hero-facts { display: none; }
            .hero-actions { margin-top: 18px; }
        }
    </style>
</head>

    <header class="landing-top">
        <a class="brand" href="/welcome.html"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-bridge"/></svg></span><span class="brand-name">TruckSetu</span></a>
        <nav class="landing-nav" aria-label="Account">
            <button type="button" class="btn btn-glass btn-small" data-theme-toggle></button>
            <a class="btn btn-glass btn-small" href="/login.html" data-guest>Log in</a>
            <a class="btn btn-primary btn-small" href="/login.html?mode=signup" data-guest>Sign up</a>
            <a class="btn btn-primary btn-small" id="dashboard-link" href="/login.html" hidden>Open dashboard</a>
        </nav>
    </header>

    <main class="hero">
        <span class="eyebrow">Road freight across India</span>
        <h1>Every truck, the shortest road.</h1>
        <p class="lead">Book shipments, dispatch trucks and track every delivery, all in one place.</p>
        <div class="hero-actions">
            <a class="btn btn-primary btn-large" href="/login.html?mode=signup" data-guest>Get started</a>
            <a class="btn btn-glass btn-large" href="/login.html" data-guest>Log in</a>
        </div>
        <p class="hero-facts" id="hero-facts" hidden>
            <span><strong id="fact-cities"></strong> cities on the road map</span>
            <span><strong id="fact-warehouses"></strong> warehouses</span>
            <span>from <strong id="fact-rate"></strong> per tonne-km</span>
        </p>
    </main>

    <script src="app.js"></script>
    <script>
        // Already logged in: one button to the dashboard instead of Log in and Sign up
        App.api('/api/me').then(me => {
            if (!me.user) return;
            document.querySelectorAll('[data-guest]').forEach(link => { link.hidden = true; });
            const dashboard = document.getElementById('dashboard-link');
            dashboard.href = me.home;
            dashboard.hidden = false;
        }).catch(() => { /* the server couldn't say: keep Log in and Sign up */ });

        // The numbers under the buttons come from the server, so they stay true as cities and warehouses are added
        App.api('/api/catalog').then(catalog => {
            document.getElementById('fact-cities').textContent = App.formatNumber(catalog.cities.length);
            document.getElementById('fact-warehouses').textContent = App.formatNumber(catalog.warehouses.length);
            document.getElementById('fact-rate').textContent = App.formatMoney(catalog.pricing.rate_per_tonne_km);
            document.getElementById('hero-facts').hidden = false;
        }).catch(() => { /* no numbers: the line stays hidden */ });
    </script>
