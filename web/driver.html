<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics ERP | Driver</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .driver-container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 20px; margin-bottom: 30px; }
        .header h1 { font-size: 2rem; color: var(--primary-dark); }
        .header p { margin-top: 5px; color: var(--text-muted); }
        .driver-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 45px; height: 45px; background: var(--accent-red); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; border: 1px solid rgba(0,0,0,0.05); border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .card + .card { margin-top: 30px; }
        .grid .card + .card { margin-top: 0; }
        .card-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .data-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .data-row:last-child { border-bottom: none; }
        .d-label { color: var(--text-muted); }
        .d-value { font-weight: 700; color: var(--primary-dark); text-align: right; }
        .trip-card { background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%); color: white; }
        .trip-card .card-title { color: #cbd5e1; }
        .trip-card .d-label { color: #94a3b8; }
        .trip-card .d-value { color: #fff; }
        .trip-card .data-row { border-color: rgba(255,255,255,0.08); }
        .trip-card .badge-info { background: rgba(147, 197, 253, 0.2); color: #bfdbfe; }
        .trip-card .badge-warn { background: rgba(251, 191, 36, 0.2); color: #fde68a; }
        .dest { font-size: 2rem; font-weight: 800; margin: 6px 0 4px; }
        .steps { display: flex; gap: 8px; margin: 24px 0; }
        .step { flex: 1; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #94a3b8; font-size: 0.8rem; font-weight: 700; text-align: center; }
        .step.done { background: rgba(46, 204, 113, 0.18); color: #7ee2a8; }
        .step.now { background: var(--accent-red); color: #fff; }
        .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 10px; }
        .legs { list-style: none; font-size: 0.88rem; line-height: 1.5; }
        .legs li { padding: 7px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        .legs li span { color: #94a3b8; }
        .cargo { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; font-size: 0.88rem; line-height: 1.6; }
        .cargo strong { color: #fff; }
        .cargo .handling { color: #fbbf24; }
        .btn-action { width: 100%; margin-top: 24px; }
        .sub { color: #94a3b8; font-size: 0.85rem; }
        td { padding: 14px 16px; }
        @media (max-width: 760px) { .columns { grid-template-columns: 1fr; } .header { flex-direction: column; align-items: flex-start; gap: 16px; } }
    </style>
</head>
<body>
    <div class="driver-container">
        <header class="header">
            <div>
                <h1>Driver dashboard</h1>
                <p>Welcome back, <strong id="dr-name">…</strong></p>
            </div>
            <div class="driver-profile">
                <button class="btn-secondary" id="refresh">↻ Refresh</button>
                <button class="btn-secondary" id="logout">Log out</button>
                <div class="avatar" id="avatar">D</div>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-title">Licence</div>
                <div class="data-row"><span class="d-label">Number</span><span class="d-value" id="dr-licence">…</span></div>
                <div class="data-row"><span class="d-label">Class</span><span class="d-value" id="dr-class">…</span></div>
                <div class="data-row"><span class="d-label">You may drive</span><span class="d-value" id="dr-covers">…</span></div>
            </div>
            <div class="card">
                <div class="card-title">Warehouse</div>
                <div class="data-row"><span class="d-label">Code</span><span class="d-value" id="wh-code">…</span></div>
                <div class="data-row"><span class="d-label">Name</span><span class="d-value" id="wh-name">…</span></div>
                <div class="data-row"><span class="d-label">City</span><span class="d-value" id="wh-city">…</span></div>
            </div>
            <div class="card">
                <div class="card-title">Status</div>
                <div id="dr-status" style="margin-bottom: 12px;"></div>
                <p class="muted small" id="dr-status-text"></p>
            </div>
        </div>

        <div id="trip-panel" class="card trip-card" hidden></div>

        <div id="idle-panel" class="card" hidden style="text-align: center; padding: 50px 20px;">
            <div style="font-size: 3rem; margin-bottom: 16px;">☕</div>
            <h2 style="color: var(--primary-dark); margin-bottom: 10px;">No trip right now</h2>
            <p class="muted" style="max-width: 440px; margin: 0 auto;">When the warehouse manager dispatches an order to you, the truck, the route and the cargo appear here.</p>
        </div>

        <div class="card">
            <div class="card-title">Finished trips</div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Trip</th><th>Truck</th><th>Route</th><th>Km (both ways)</th><th>Left</th><th>Back</th><th>Took</th></tr></thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const E = App.escape;
        const AVERAGE_SPEED_KMH = 50;  // for the travel-time estimate only
        let data = null;

        async function load() {
            data = await App.api('/api/driver/dashboard');
            render();
        }

        function render() {
            const user = data.user, driver = data.driver, trip = data.trip;
            $('dr-name').textContent = user.full_name;
            $('avatar').textContent = (user.full_name || 'D').trim().charAt(0).toUpperCase();
            $('dr-licence').textContent = driver.licence_no;
            $('dr-class').textContent = driver.licence_class;
            $('dr-covers').textContent = driver.licence_class === 'HMV' ? 'Every truck' : 'Trucks up to 7.5 t gross weight';
            $('wh-code').textContent = user.warehouse.code;
            $('wh-name').textContent = user.warehouse.name;
            $('wh-city').textContent = user.warehouse.city;

            const status = trip ? trip.status : 'available';
            $('dr-status').innerHTML = App.badge(status);
            $('dr-status-text').textContent = !trip ? 'Waiting at the warehouse for the next trip.'
                : trip.status === 'in_transit' ? 'Driving to the delivery. Confirm it once the goods are handed over.'
                : 'Delivered. Driving back to the warehouse.';

            $('trip-panel').hidden = !trip;
            $('idle-panel').hidden = !!trip;
            if (trip) renderTrip(trip, user.warehouse);
            renderHistory();
        }

        function renderTrip(trip, warehouse) {
            const cities = trip.route.path || [];
            const destination = cities[cities.length - 1] || '';
            const totalKg = trip.orders.reduce((sum, o) => sum + o.weight_kg, 0);
            const totalM3 = trip.orders.reduce((sum, o) => sum + o.volume_m3, 0);
            const hours = trip.distance_km / AVERAGE_SPEED_KMH;
            const delivered = trip.status === 'returning';

            $('trip-panel').innerHTML = `
                <div class="card-title"><span>Trip #${trip.id}</span>${App.badge(trip.status)}</div>
                <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap;">
                    <div><div class="sub">${delivered ? 'Delivered in' : 'Heading to'}</div><div class="dest">${E(destination)}</div>
                        <div class="sub">${App.formatNumber(trip.distance_km)} km from ${E(warehouse.city)} · about ${App.formatNumber(hours, 1)} h at ${AVERAGE_SPEED_KMH} km/h on average</div></div>
                    <div style="text-align: right;"><div class="sub">Load</div><div class="dest" style="font-size: 1.5rem;">${App.formatNumber(totalKg)} kg</div>
                        <div class="sub">${App.formatNumber(totalM3, 1)} m³ of ${App.formatNumber(trip.truck.volume_m3, 1)} m³</div></div>
                </div>

                <div class="steps">
                    <div class="step done">Left ${E(warehouse.city)} · ${App.formatDate(trip.dispatched_at)}</div>
                    <div class="step ${delivered ? 'done' : 'now'}">${delivered ? 'Delivered · ' + App.formatDate(trip.delivered_at) : 'Deliver in ' + E(destination)}</div>
                    <div class="step ${delivered ? 'now' : ''}">Back at ${E(warehouse.city)}</div>
                </div>

                <div class="columns">
                    <div>
                        <div class="card-title">Truck</div>
                        <div class="data-row"><span class="d-label">Plate</span><span class="d-value">${E(trip.truck.plate)}</span></div>
                        <div class="data-row"><span class="d-label">Model</span><span class="d-value">${E(trip.truck.model)}</span></div>
                        <div class="data-row"><span class="d-label">Body</span><span class="d-value">${E(trip.truck.body_type)}</span></div>
                        <div class="data-row"><span class="d-label">Payload</span><span class="d-value">${App.formatNumber(trip.truck.payload_kg)} kg</span></div>
                        <div class="card-title" style="margin-top: 22px;">Route</div>
                        <ul class="legs">${(trip.route.legs || []).map(leg =>
                            `<li>${E(leg.from)} → ${E(leg.to)} <span>· ${E(leg.road)} · ${App.formatNumber(leg.km)} km</span></li>`).join('')}</ul>
                    </div>
                    <div>
                        <div class="card-title">Cargo</div>
                        ${trip.orders.map(o => `
                            <div class="cargo">
                                <strong>Order #${o.id} · ${E(App.quantity(o.quantity, o.unit))} of ${E(o.goods_name)}</strong><br>
                                ${App.formatNumber(o.weight_kg)} kg · ${App.formatNumber(o.volume_m3, 1)} m³ · from ${E(o.customer)}<br>
                                <span class="handling">⚠ ${E(o.handling)}</span><br>
                                Deliver to: ${E(o.receiver_name)}${o.receiver_phone ? ' · ' + E(o.receiver_phone) : ''}<br>
                                ${E(o.delivery_address)}
                                ${o.notes ? `<br><span class="sub">Note: ${E(o.notes)}</span>` : ''}
                            </div>`).join('')}
                    </div>
                </div>

                <button class="btn-primary btn-action" id="trip-action">${delivered ? `Back at the warehouse in ${E(warehouse.city)}` : 'Confirm delivery'}</button>`;

            $('trip-action').addEventListener('click', event => App.busy(event.target, async () => {
                if (!delivered) {
                    if (!confirm(`Confirm that the goods were handed over in ${destination}?`)) return;
                    await App.api('/api/driver/trips/delivered', { trip_id: trip.id });
                    App.notify('Delivery confirmed. Drive safely back to the warehouse.');
                } else {
                    await App.api('/api/driver/trips/returned', { trip_id: trip.id });
                    App.notify('Welcome back! The truck is free for the next trip.');
                }
                await load();
            }));
        }

        function renderHistory() {
            $('history-body').innerHTML = data.history.length ? data.history.map(t => `
                <tr>
                    <td><strong>#${t.id}</strong></td>
                    <td>${E(t.truck_plate)}</td>
                    <td class="route">${(t.path || []).map(E).join(' → ')}</td>
                    <td>${App.formatNumber(2 * t.distance_km)} km</td>
                    <td class="small">${App.formatDate(t.dispatched_at)}</td>
                    <td class="small">${App.formatDate(t.completed_at)}</td>
                    <td class="small">${App.duration(t.dispatched_at, t.completed_at)}</td>
                </tr>`).join('') : '<tr><td colspan="7" class="empty">No finished trips yet.</td></tr>';
        }

        $('logout').addEventListener('click', App.logout);
        $('refresh').addEventListener('click', event => App.busy(event.target, load));
        load().catch(error => App.notify(error.message, 'error'));
        setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 30000);
    </script>
</body>
</html>
