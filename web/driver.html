<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruckSetu | Driver</title>
    <script>try { if (localStorage.getItem('trucksetu-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <style>
        .driver-layout { display: grid; gap: 18px; }
        .driver-main { display: grid; gap: 18px; min-width: 0; }
        .driver-main > .panel + .panel { margin-top: 0; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; align-content: start; }
        .info-grid .panel + .panel { margin-top: 0; }
        /* Wide screens: the trip on the left, the licence and warehouse boxes in a column on the right */
        @media (min-width: 1400px) {
            .driver-layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
            .driver-main { grid-column: 1; grid-row: 1; }
            .info-grid { grid-column: 2; grid-row: 1; grid-template-columns: minmax(0, 1fr); }
        }
        .rows { display: grid; }
        .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
        .row:last-child { border-bottom: 0; padding-bottom: 0; }
        .row span:first-child { color: var(--muted); }
        .row span:last-child { font-weight: 600; text-align: right; }
        .panel-title { font-size: 0.76rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
        .trip-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
        .dest { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; }
        .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 20px 0; }
        .step { padding: 10px 12px; border-radius: var(--radius); background: var(--box); color: var(--muted); font-size: 0.84rem; font-weight: 500; }
        .step.done { background: var(--ok-soft); color: var(--ok); }
        .step.now { background: var(--ink); color: var(--on-ink); }
        .columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
        .legs { list-style: none; }
        .legs li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.92rem; }
        .legs li:last-child { border-bottom: 0; }
        .legs li span { color: var(--muted); }
        .cargo { background: var(--box); border-radius: var(--radius); padding: 14px; display: grid; gap: 4px; font-size: 0.92rem; }
        .cargo + .cargo { margin-top: 10px; }
        .handling { color: var(--warn); font-weight: 500; }
        .idle { text-align: center; padding: 48px 20px; }
        .idle .icon { width: 40px; height: 40px; color: var(--muted); margin-bottom: 10px; }
        @media (max-width: 760px) { .columns { grid-template-columns: minmax(0, 1fr); } .steps { grid-template-columns: minmax(0, 1fr); } .dest { font-size: 1.6rem; } }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/driver.html"><span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-bridge"/></svg></span><span class="brand-name">TruckSetu</span></a>
            <div class="topbar-actions">
                <button class="btn btn-secondary btn-small" id="refresh"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>Refresh</button>
                <button class="btn btn-secondary btn-small" data-theme-toggle></button>
                <button class="btn btn-secondary btn-small" id="logout"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>Log out</button>
            </div>
        </div>
    </header>

    <main class="page-wrap">
        <div class="page-head"><div><h1>Hello, <span id="dr-name">…</span></h1><p id="dr-status-text">Loading your trips…</p></div><div id="dr-status"></div></div>

        <div class="driver-layout">
            <div class="info-grid">
                <div class="panel">
                    <div class="panel-title">Licence</div>
                    <div class="rows">
                        <div class="row"><span>Number</span><span id="dr-licence">…</span></div>
                        <div class="row"><span>Class</span><span id="dr-class">…</span></div>
                        <div class="row"><span>You may drive</span><span id="dr-covers">…</span></div>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-title">Warehouse</div>
                    <div class="rows">
                        <div class="row"><span>Code</span><span id="wh-code">…</span></div>
                        <div class="row"><span>Name</span><span id="wh-name">…</span></div>
                        <div class="row"><span>City</span><span id="wh-city">…</span></div>
                    </div>
                </div>
            </div>

            <div class="driver-main">
                <section id="trip-panel" class="panel" hidden></section>

                <section id="idle-panel" class="panel idle" hidden>
                    <svg class="icon" aria-hidden="true"><use href="#i-truck"/></svg>
                    <h2>No trip right now</h2>
                    <p class="muted" style="max-width: 440px; margin: 6px auto 0;">When the warehouse manager dispatches an order to you, the truck, the route and the cargo appear here.</p>
                </section>

                <section class="panel">
                    <div class="panel-head"><h2>Finished trips</h2></div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Trip</th><th>Truck</th><th>Route</th><th>Km (both ways)</th><th>Left</th><th>Back</th><th>Took</th></tr></thead>
                            <tbody id="history-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const E = App.escape;
        const AVERAGE_SPEED_KMH = 50;  // for the travel-time estimate only
        let data = null;

        async function load() {
            data = await App.api('/api/driver/dashboard');
            render();
        }

        function render() {
            const user = data.user, driver = data.driver, trip = data.trip;
            $('dr-name').textContent = user.full_name;
            $('dr-licence').textContent = driver.licence_no;
            $('dr-class').textContent = driver.licence_class;
            $('dr-covers').textContent = driver.licence_class === 'HMV' ? 'Every truck' : 'Trucks up to 7.5 t gross weight';
            $('wh-code').textContent = user.warehouse.code;
            $('wh-name').textContent = user.warehouse.name;
            $('wh-city').textContent = user.warehouse.city;

            $('dr-status').innerHTML = App.badge(trip ? trip.status : 'available');
            $('dr-status-text').textContent = !trip ? 'Waiting at the warehouse for the next trip.'
                : trip.status === 'in_transit' ? 'Driving to the delivery. Confirm it once the goods are handed over.'
                : 'Delivered. Driving back to the warehouse.';

            $('trip-panel').hidden = !trip;
            $('idle-panel').hidden = !!trip;
            if (trip) renderTrip(trip, user.warehouse);
            renderHistory();
        }

        function renderTrip(trip, warehouse) {
            const cities = trip.route.path || [];
            const destination = cities[cities.length - 1] || '';
            const totalKg = trip.orders.reduce((sum, o) => sum + o.weight_kg, 0);
            const totalM3 = trip.orders.reduce((sum, o) => sum + o.volume_m3, 0);
            const hours = trip.distance_km / AVERAGE_SPEED_KMH;
            const delivered = trip.status === 'returning';

            $('trip-panel').innerHTML = `
                <div class="panel-head"><h2>Trip #${trip.id}</h2>${App.badge(trip.status)}</div>
                <div class="trip-top">
                    <div><div class="muted small">${delivered ? 'Delivered in' : 'Heading to'}</div><div class="dest">${E(destination)}</div>
                        <div class="muted small">${App.formatNumber(trip.distance_km)} km from ${E(warehouse.city)} · about ${App.formatNumber(hours, 1)} h at ${AVERAGE_SPEED_KMH} km/h on average</div></div>
                    <div style="text-align: right;"><div class="muted small">Load</div><div class="dest num" style="font-size: 1.5rem;">${App.formatNumber(totalKg)} kg</div>
                        <div class="muted small">${App.formatNumber(totalM3, 1)} m³ of ${App.formatNumber(trip.truck.volume_m3, 1)} m³</div></div>
                </div>

                <div class="steps">
                    <div class="step done">Left ${E(warehouse.city)} · ${App.formatDate(trip.dispatched_at)}</div>
                    <div class="step ${delivered ? 'done' : 'now'}">${delivered ? 'Delivered · ' + App.formatDate(trip.delivered_at) : 'Deliver in ' + E(destination)}</div>
                    <div class="step ${delivered ? 'now' : ''}">Back at ${E(warehouse.city)}</div>
                </div>

                <div class="columns">
                    <div>
                        <div class="panel-title">Truck</div>
                        <div class="rows">
                            <div class="row"><span>Plate</span><span>${E(trip.truck.plate)}</span></div>
                            <div class="row"><span>Model</span><span>${E(trip.truck.model)}</span></div>
                            <div class="row"><span>Body</span><span>${E(trip.truck.body_type)}</span></div>
                            <div class="row"><span>Payload</span><span class="num">${App.formatNumber(trip.truck.payload_kg)} kg</span></div>
                        </div>
                        <div class="panel-title" style="margin-top: 20px;">Route</div>
                        <ul class="legs">${(trip.route.legs || []).map(leg =>
                            `<li>${E(leg.from)} → ${E(leg.to)} <span>· ${E(leg.road)} · ${App.formatNumber(leg.km)} km</span></li>`).join('')}</ul>
                    </div>
                    <div>
                        <div class="panel-title">Cargo</div>
                        ${trip.orders.map(o => `
                            <div class="cargo">
                                <strong>Order #${o.id} · ${E(App.quantity(o.quantity, o.unit))} of ${E(o.goods_name)}</strong>
                                <span class="muted">${App.formatNumber(o.weight_kg)} kg · ${App.formatNumber(o.volume_m3, 1)} m³ · from ${E(o.customer)}</span>
                                <span class="handling">${E(o.handling)}</span>
                                <span>Deliver to ${E(o.receiver_name)}${o.receiver_phone ? ' · ' + E(o.receiver_phone) : ''}</span>
                                <span class="muted">${E(o.delivery_address)}</span>
                                ${o.notes ? `<span class="muted">Note: ${E(o.notes)}</span>` : ''}
                            </div>`).join('')}
                    </div>
                </div>

                <div class="form-actions"><button class="btn btn-primary btn-block" id="trip-action">${delivered ? `Back at the warehouse in ${E(warehouse.city)}` : 'Confirm delivery'}</button></div>`;

            $('trip-action').addEventListener('click', event => App.busy(event.currentTarget, async () => {
                if (!delivered) {
                    if (!confirm(`Confirm that the goods were handed over in ${destination}?`)) return;
                    await App.api('/api/driver/trips/delivered', { trip_id: trip.id });
                    App.notify('Delivery confirmed. Drive safely back to the warehouse.');
                } else {
                    await App.api('/api/driver/trips/returned', { trip_id: trip.id });
                    App.notify('Welcome back! The truck is free for the next trip.');
                }
                await load();
            }));
        }

        function renderHistory() {
            $('history-body').innerHTML = data.history.length ? data.history.map(t => `
                <tr>
                    <td><strong>#${t.id}</strong></td>
                    <td class="nowrap">${E(t.truck_plate)}</td>
                    <td class="route">${(t.path || []).map(E).join(' → ')}</td>
                    <td class="num">${App.formatNumber(2 * t.distance_km)} km</td>
                    <td class="small">${App.formatDate(t.dispatched_at)}</td>
                    <td class="small">${App.formatDate(t.completed_at)}</td>
                    <td class="small">${App.duration(t.dispatched_at, t.completed_at)}</td>
                </tr>`).join('') : '<tr><td colspan="7" class="empty">No finished trips yet.</td></tr>';
        }

        $('logout').addEventListener('click', App.logout);
        $('refresh').addEventListener('click', event => App.busy(event.currentTarget, load));
        load().catch(error => App.notify(error.message, 'error'));
        setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 30000);
    </script>
</body>
</html>
